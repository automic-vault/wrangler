name:
  isotope:wrangler

replaces:
  npm:wrangler

build: |
  node_version=26.8.1
  node_sha256=6e577fd0d9db776db82306629e441a9dace416702622aebdd171c9dfaa41f4d2
  node_work="$(mktemp -d "${TMPDIR:-/tmp}/wrangler-node.XXXXXX")"
  trap 'rm -rf "$node_work"' EXIT
  node_archive="$node_work/node.tgz"
  curl --fail --location --silent --show-error \
    --output "$node_archive" \
    "https://nodejs.org/dist/v${node_version}/node-v${node_version}-darwin-arm64.tar.gz"
  printf '%s  %s\n' "$node_sha256" "$node_archive" | shasum -a 256 -c -
  tar -xzf "$node_archive" -C "$node_work"
  node_dir="$node_work/node-v${node_version}-darwin-arm64"
  PATH="$node_dir/bin:$PATH" pnpm install --frozen-lockfile
  PATH="$node_dir/bin:$PATH" "$node_dir/bin/node" isotope/build.mjs
  cp "isotope/out/cli-$("$node_dir/bin/node" -p 'require("./packages/wrangler/package.json").version').tgz" out.tgz

justification:
  title:
    Unprotected Credential Access
  detail: |
    This Isotope keeps Wrangler OAuth credentials in Automic Vault custody
    and routes credential use through its authenticated XPC service.
    The signed runtime and bundled dependencies replace project-local Node
    as the Gate Client and Target. See isotope/README.md for requirements.
