name: Isotope native client

on:
  pull_request:
    paths:
      - "isotope/**"
      - ".github/workflows/isotope-native.yml"
  push:
    branches: [main]
    paths:
      - "isotope/**"
      - ".github/workflows/isotope-native.yml"

permissions:
  contents: read

jobs:
  native-client:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26.8.1"
      - run: node isotope/automic-vault.test.mjs
